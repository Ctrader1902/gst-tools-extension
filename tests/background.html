<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>background boot test</title></head>
<body>
<script src="harness.js"></script>
<script src="chrome-stub.js"></script>
<script src="../background.js"></script>
<script>
test("background boots and loads its modules", () => {
  ok(globalThis.GSTMatch && globalThis.GSTEngine && globalThis.GSTTabs && globalThis.GSTDownloads);
});
test("side panel opens on toolbar click", () => {
  ok(chromeCalls.some((c) => c.path === "chrome.sidePanel.setPanelBehavior"
                        && c.args[0].openPanelOnActionClick === true));
});
test("start without a logged-in portal tab answers login", async () => {
  const r = await handle({ cmd: "start", taskKey: "gstr2b_json", fy: "2025-26", months: ["June"], mode: "download" });
  eq(r, { error: "login" });
});
test("generate refused for non-R1", async () => {
  const r = await handle({ cmd: "start", taskKey: "gstr2b_excel", fy: "2025-26", months: ["June"], mode: "generate" });
  eq(r.error, "Only R1 JSON has a generate step.");
});
test("status reports not logged in", async () => {
  const r = await handle({ cmd: "status" });
  eq(r.loggedIn, false);
  eq(r.running, false);
});
function sendFrom(sender, msg) {
  return new Promise((resolve) => {
    const fns = chromeEvents["chrome.runtime.onMessage"].fns;
    let answered = false;
    for (const f of fns) {
      const keep = f(msg, sender, (r) => { answered = true; resolve(r); });
      if (keep === true) return;
    }
    if (!answered) resolve("no answer");
  });
}
test("answers extension pages, also when open in a tab", async () => {
  const r = await sendFrom({ id: "test-ext-id", tab: { id: 7 },
                             url: "chrome-extension://test-ext-id/sidepanel/index.html" }, { cmd: "status" });
  eq(r.loggedIn, false);
});
test("ignores other extensions", async () => {
  eq(await sendFrom({ id: "someone-else" }, { cmd: "status" }), "no answer");
});
test("summary wording", () => {
  const s = summarize("gstr2b_json", { April: { state: "saved" }, June: { state: "pending" } });
  eq(s, { kind: "warn", text: "GSTR-2B JSON: 1 downloaded, 1 not ready yet." });
});
test("session expiry becomes the status, and logged-in waits for a fresh portal page", async () => {
  const s = summarize("gstr3b_ack", { April: { state: "saved" },
    May: { state: "not_run", note: "GST session has expired - log in again." } });
  eq(s.expired, true);
  eq(s.kind, "err");
  ok(s.text.startsWith("Session expired - log in to the GST portal again"), s.text);
  const authTab = { id: 5, windowId: 1, index: 0, url: "https://services.gst.gov.in/services/auth/dashboard" };
  chromeAnswers["chrome.tabs.query"] = () => [authTab];
  sessionExpired = true;
  eq((await handle({ cmd: "status" })).loggedIn, false, "old tab after expiry");
  chromeEvents["chrome.tabs.onUpdated"].fns.forEach((f) => f(5, { status: "complete" }, authTab));
  eq((await handle({ cmd: "status" })).loggedIn, true, "after a fresh portal page");
  chromeAnswers["chrome.tabs.query"] = () => [];
});
test("sleep and download waits notice Stop", async () => {
  stopReason = "Stopped by you.";
  let e1 = null, e2 = null;
  try { await makeCtx().sleep(5); } catch (e) { e1 = e; }
  try { await makeCtx().downloads.waitNew(0, 1000); } catch (e) { e2 = e; }
  stopReason = null;
  ok(e1 instanceof GSTEngine.Stopped, "sleep");
  ok(e2 instanceof GSTEngine.Stopped, "waitNew");
});
test("a second start while the first is starting is refused", async () => {
  const authTab = { id: 5, windowId: 1, index: 0, url: "https://services.gst.gov.in/services/auth/dashboard" };
  chromeAnswers["chrome.tabs.query"] = () => [authTab];
  chromeAnswers["chrome.tabs.duplicate"] = () => ({ id: 9, windowId: 1, index: 1 });
  chromeAnswers["chrome.tabs.get"] = (id) => ({ id, status: "complete" });
  const msg = { cmd: "start", taskKey: "gstr3b_ack", fy: "2025-26", months: ["May"], mode: "download" };
  const [a, b] = await Promise.all([handle(msg), handle(msg)]);
  eq([a.ok || a.error, b.ok || b.error].sort(), [true, "A run is already in progress."].sort());
  stopReason = "Stopped by you.";           // end the stub run quickly
  for (let i = 0; i < 100 && (running || starting); i++) await new Promise((r) => setTimeout(r, 50));
  chromeAnswers["chrome.tabs.query"] = () => [];
});
test("a run allows multiple downloads on GST sites, then puts the setting back", async () => {
  const sets = chromeCalls.filter((c) => c.path === "chrome.contentSettings.automaticDownloads.set");
  ok(sets.some((c) => c.args[0].primaryPattern === "https://*.gst.gov.in/*" && c.args[0].setting === "allow"),
     "allowed for GST sites");
  ok(chromeCalls.some((c) => c.path === "chrome.contentSettings.automaticDownloads.clear"), "cleared after the run");
});
test("the run finishes even if closing its tab never completes", async () => {
  const authTab = { id: 5, windowId: 1, index: 0, url: "https://services.gst.gov.in/services/auth/dashboard" };
  chromeAnswers["chrome.tabs.query"] = () => [authTab];
  chromeAnswers["chrome.tabs.duplicate"] = () => ({ id: 11, windowId: 1, index: 1 });
  chromeAnswers["chrome.tabs.get"] = (id) => ({ id, status: "complete" });
  chromeAnswers["chrome.tabs.remove"] = () => new Promise(() => {});     // e.g. a "Leave site?" prompt
  const r = await handle({ cmd: "start", taskKey: "gstr3b_ack", fy: "2025-26", months: ["May"], mode: "download" });
  eq(r.ok, true);
  stopReason = "Stopped by you.";
  for (let i = 0; i < 60 && (running || starting); i++) await new Promise((r) => setTimeout(r, 50));
  eq(!!running, false, "run marked finished");
  delete chromeAnswers["chrome.tabs.remove"];
  chromeAnswers["chrome.tabs.query"] = () => [];
});
</script>
</body></html>
